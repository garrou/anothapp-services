name: Deploy to alwaysdata

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Actions
    steps:
      - name: Deploy via SSH (git pull + npm install)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.ALWAYSDATA_APP_PATH }}
            BEFORE=$(git rev-parse HEAD)
            git pull origin main
            AFTER=$(git rev-parse HEAD)
            if git diff --name-only $BEFORE $AFTER | grep -qE '^package(-lock)?\.json$'; then
              npm install --omit=dev
            else
              echo "skip npm install"
            fi

      - name: Restart app via alwaysdata API
        run: |
          curl -X POST --basic \
            --user "${{ secrets.ALWAYSDATA_API_KEY }} account=${{ secrets.ALWAYSDATA_ACCOUNT }}:" \
            https://api.alwaysdata.com/v1/site/${{ secrets.ALWAYSDATA_SITE_ID }}/restart/