name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: anothapp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d anothapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm test

      # Service containers start before checkout, so they can't auto-run migrations/init.sql via
      # docker-entrypoint-initdb.d the way docker-compose.test.yml does locally - apply it explicitly.
      - name: Apply schema to the integration-test database
        run: PGPASSWORD=test psql -h localhost -p 5433 -U test -d anothapp_test -f migrations/init.sql

      - run: npm run test:pg